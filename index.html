<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#edf4d2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Vườn Kỳ Diệu" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <title>Little Wonders · Khu Vườn Kỳ Diệu</title>
    <!-- Resolve Light/Dark/System before first paint. Keep the key and colors in sync with ThemeToggle.tsx. -->
    <script>
      (function () {
        var preference = "system";
        try {
          var saved = localStorage.getItem("little-wonders-theme");
          if (saved === "light" || saved === "dark") preference = saved;
        } catch (e) {}
        var dark = false;
        try {
          dark = matchMedia("(prefers-color-scheme: dark)").matches;
        } catch (e) {}
        var resolved =
          preference === "system" ? (dark ? "dark" : "light") : preference;
        var root = document.documentElement;
        root.dataset.themePreference = preference;
        root.dataset.theme = resolved;
        root.style.colorScheme = resolved;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta)
          meta.setAttribute(
            "content",
            resolved === "dark" ? "#131b22" : "#edf4d2",
          );
      })();
    </script>
    <style>
      html {
        background: #faf8ee;
      }
      html[data-theme="dark"] {
        background: #131b1a;
      }
      .splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 18px;
      }
      .splash img {
        width: 96px;
        height: 96px;
        border-radius: 24px;
        box-shadow: 0 10px 30px rgba(35, 62, 51, 0.18);
      }
      .splash-dots {
        display: flex;
        gap: 8px;
      }
      .splash-dots i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #52684e;
        opacity: 0.35;
        animation: splash 1.2s ease-in-out infinite;
      }
      html[data-theme="dark"] .splash-dots i {
        background: #a8cf8f;
      }
      .splash-dots i:nth-child(2) {
        animation-delay: 0.15s;
      }
      .splash-dots i:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes splash {
        50% {
          opacity: 1;
          transform: translateY(-4px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-dots i {
          animation: none;
          opacity: 0.7;
        }
      }
      @media (forced-colors: active) {
        .splash-dots i {
          background: CanvasText;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" role="status" aria-label="Đang mở khu vườn">
        <img src="/icon-192.png" alt="" width="96" height="96" />
        <span class="splash-dots" aria-hidden="true"
          ><i></i><i></i><i></i
        ></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
